version: "3"

tasks:
  default:
    desc: Run check + test
    aliases: [all]
    cmds:
      - task: check
      - task: test

  check:
    desc: Modernize gate + gofumpt + prettier + go vet + golangci-lint + nilaway
    cmds:
      - task: modernize
      - task: fmt:check
      - task: fmt:check:docs
      - task: vet
      - task: lint
      - task: nilaway

  # Apply Go modernizations (min/max, range over int, new(value), etc.)
  # and fail if the working tree is no longer clean against HEAD for *.go.
  # This makes modernize signal mandatory rather than advisory.
  modernize:
    desc: Apply go fix and fail if it produced any changes
    cmds:
      - go fix ./...
      - |
        if ! git diff --quiet -- '*.go'; then
          echo ""
          echo "ERROR: go fix ./... produced changes. Review with 'git diff' and commit before continuing."
          echo "(If these changes are unrelated work-in-progress, stage them and re-run.)"
          git diff --stat -- '*.go'
          exit 1
        fi

  fmt:check:
    desc: Check formatting with gofumpt -extra
    cmds:
      - |
        output="$(gofumpt -l -extra .)"
        if [ -n "$output" ]; then
          echo "$output"
          echo "gofumpt formatting check failed: run 'task fmt' to fix." >&2
          exit 1
        fi

  fmt:check:docs:
    desc: Check JSON and Markdown formatting with prettier
    cmds:
      - |
        if ! command -v prettier >/dev/null 2>&1; then
          echo "prettier not found: install it with 'brew install prettier'." >&2
          exit 1
        fi
        prettier --check . || {
          echo "prettier formatting check failed: run 'task fmt' to fix." >&2
          exit 1
        }

  fmt:
    desc: Format Go with gofumpt, JSON and Markdown with prettier
    cmds:
      - gofumpt -l -w -extra .
      - prettier --write --log-level warn .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  # NilAway proves the absence of nil dereferences across function
  # boundaries, which golangci-lint does not attempt. It is upstream-
  # flagged as experimental and can report false positives; prefer an
  # explicit nil check that makes the guard real over a suppression
  # comment, as chargen/engine.go's civilian branch does. Exits 3 on
  # findings, so it gates like the rest.
  nilaway:
    desc: Run NilAway's cross-function nil analysis
    cmds:
      - nilaway ./...

  # A ratchet on the number of *uncovered statements* per package, not on a
  # coverage percentage. Percentages cannot do this job: a guarded branch
  # adds one covered statement (the condition) and one uncovered (the body),
  # so chargen's 795/878 becomes 796/880 — 90.55% to 90.45%, both of which
  # `go test -cover` prints as 90.5%. That is the exact shape of the E009
  # stamp, which shipped through a fully green gate with no test. Counting
  # statements is integer-exact and trips on the first one.
  #
  # Ceilings are a ratchet in the same spirit as the unpinned toolchain: a
  # gate that fails when something moves is doing its job. Lower one
  # whenever coverage improves. Raise one only with a reason worth writing
  # down in the commit that raises it.
  #
  # internal/fixture is absent by design: it is the golden-fixture roster,
  # imported only by tests and declaring none of its own, so every one of
  # its statements reads as uncovered no matter how hard the suite leans on
  # it.
  test:
    desc: Run all tests with race detector, failing any package that gains an untested statement
    cmds:
      - |
        set -eu
        ceilings="chargen:85 cmd/ctchargen:53 dice:2 render:1 service:16"
        profile=$(mktemp)
        trap 'rm -f "$profile"' EXIT
        go test -race -coverprofile="$profile" ./...
        measured=$(awk 'NR>1 {
          split($1, a, ":"); n = split(a[1], part, "/");
          pkg = part[4]; for (i = 5; i < n; i++) pkg = pkg "/" part[i];
          total[pkg] += $2; if ($3 > 0) covered[pkg] += $2
        } END { for (p in total) printf "%s %d %d\n", p, total[p] - covered[p], total[p] }' "$profile")
        failed=0
        for entry in $ceilings; do
          pkg=${entry%:*}
          ceiling=${entry#*:}
          got=$(printf '%s\n' "$measured" | awk -v p="$pkg" '$1 == p { print $2 }')
          if [ -z "$got" ]; then
            echo "coverage: no profile data for $pkg — is it still a package?" >&2
            failed=1
            continue
          fi
          if [ "$got" -gt "$ceiling" ]; then
            echo "coverage: $pkg has $got uncovered statements, ceiling $ceiling — test the new code, or raise the ceiling deliberately" >&2
            failed=1
          elif [ "$got" -lt "$ceiling" ]; then
            echo "coverage: $pkg down to $got uncovered statements (ceiling $ceiling) — lower the ceiling in Taskfile.yml" >&2
            failed=1
          fi
        done
        [ "$failed" -eq 0 ] || exit 1

  # The fixtures under chargen/testdata and render/testdata are the
  # engine's and renderer's own output, compared byte for byte.
  # Regenerating them is a deliberate act: run this only when a change was
  # meant to move them, and read the diff before committing it.
  #
  # The package list is explicit because -update is defined per test
  # package: `go test ./... -update` fails in every package that does not
  # declare the flag. Add any new package that declares it here too.
  goldens:
    desc: Rewrite the golden fixtures, then run the full gate
    cmds:
      - go test ./chargen ./render -update
      - task: default

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  # NilAway publishes no tagged releases and has no Homebrew formula, so
  # `task deps` installs it with `go install` rather than through the
  # Brewfile; @latest resolves to its current tip commit. Unpinned like
  # the rest of the toolchain, and for the same reason: an analyzer that
  # moves should turn the gate red and be answered then, not silently
  # left behind. Keep it in step with .github/workflows/ci.yml.
  deps:
    desc: Install the development toolchain (Brewfile + NilAway at tip)
    cmds:
      - brew bundle --file=Brewfile
      - go install go.uber.org/nilaway/cmd/nilaway@latest

  hooks:
    desc: Install git hooks (point core.hooksPath at the tracked .githooks/)
    cmds:
      - git config core.hooksPath .githooks
      - echo "git hooks installed — pre-push runs 'task' (check + test)"
