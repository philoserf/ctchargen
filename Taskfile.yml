version: "3"

tasks:
  default:
    desc: Run check + test
    aliases: [all]
    cmds:
      - task: check
      - task: test

  check:
    desc: Modernize gate + gofumpt + prettier + go vet + golangci-lint + nilaway
    cmds:
      - task: modernize
      - task: fmt:check
      - task: fmt:check:docs
      - task: vet
      - task: lint
      - task: nilaway

  # Apply Go modernizations (min/max, range over int, new(value), etc.)
  # and fail if the working tree is no longer clean against HEAD for *.go.
  # This makes modernize signal mandatory rather than advisory.
  modernize:
    desc: Apply go fix and fail if it produced any changes
    cmds:
      - go fix ./...
      - |
        if ! git diff --quiet -- '*.go'; then
          echo ""
          echo "ERROR: go fix ./... produced changes. Review with 'git diff' and commit before continuing."
          echo "(If these changes are unrelated work-in-progress, stage them and re-run.)"
          git diff --stat -- '*.go'
          exit 1
        fi

  fmt:check:
    desc: Check formatting with gofumpt -extra
    cmds:
      - |
        output="$(gofumpt -l -extra .)"
        if [ -n "$output" ]; then
          echo "$output"
          echo "gofumpt formatting check failed: run 'task fmt' to fix." >&2
          exit 1
        fi

  fmt:check:docs:
    desc: Check JSON and Markdown formatting with prettier
    cmds:
      - |
        if ! command -v prettier >/dev/null 2>&1; then
          echo "prettier not found: install it with 'brew install prettier'." >&2
          exit 1
        fi
        prettier --check . || {
          echo "prettier formatting check failed: run 'task fmt' to fix." >&2
          exit 1
        }

  fmt:
    desc: Format Go with gofumpt, JSON and Markdown with prettier
    cmds:
      - gofumpt -l -w -extra .
      - prettier --write --log-level warn .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  # NilAway proves the absence of nil dereferences across function
  # boundaries, which golangci-lint does not attempt. It is upstream-
  # flagged as experimental and can report false positives; prefer an
  # explicit nil check that makes the guard real over a suppression
  # comment, as chargen/engine.go's civilian branch does. Exits 3 on
  # findings, so it gates like the rest.
  nilaway:
    desc: Run NilAway's cross-function nil analysis
    cmds:
      - nilaway ./...

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...

  # The fixtures under chargen/testdata and render/testdata are the
  # engine's and renderer's own output, compared byte for byte.
  # Regenerating them is a deliberate act: run this only when a change was
  # meant to move them, and read the diff before committing it.
  #
  # The package list is explicit because -update is defined per test
  # package: `go test ./... -update` fails in every package that does not
  # declare the flag. Add any new package that declares it here too.
  goldens:
    desc: Rewrite the golden fixtures, then run the full gate
    cmds:
      - go test ./chargen ./render -update
      - task: default

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  # NilAway publishes no tagged releases and has no Homebrew formula, so
  # it is pinned to a module pseudo-version here rather than living in the
  # Brewfile with the rest. The version is part of what the gate means:
  # an analyzer that moves on its own turns an unrelated change red.
  # Keep it in step with .github/workflows/ci.yml.
  deps:
    desc: Install the development toolchain (Brewfile + pinned Go tools)
    cmds:
      - brew bundle --file=Brewfile
      - go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260808063849-8649a03c818a

  hooks:
    desc: Install git hooks (point core.hooksPath at the tracked .githooks/)
    cmds:
      - git config core.hooksPath .githooks
      - echo "git hooks installed — pre-push runs 'task' (check + test)"
