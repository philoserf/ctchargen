name: Release

# Attaches binaries to a release that already exists. The release itself is
# made by hand -- the notes for this repository are written, not generated,
# and a workflow that created the release would either clobber them or demand
# they be produced from commit subjects.
#
# Its own file rather than a job in ci.yml, because attaching an asset needs
# `contents: write` and the gate declares `contents: read` on purpose.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      # At the tag, explicitly. A release event's github.ref is already the
      # tag, so the default would do -- but every binary's version is stamped
      # from the checkout, and a dependency that load-bearing is written down
      # rather than inherited. Checked out at main instead, all six would
      # carry a pseudo-version.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v6
        with:
          # Deliberately unpinned, as in ci.yml.
          go-version: stable

      # One job rather than a matrix. Six cross-compiles of a tool with no
      # dependencies take seconds, and checksums.txt has to cover all six --
      # which across six jobs means uploading and re-downloading every
      # artefact to compute one file.
      #
      # CGO_ENABLED=0 because the tool imports no C, so the binary runs on a
      # distribution other than the one that built it; -trimpath keeps the
      # runner's paths out of the artefact.
      #
      # Built into RUNNER_TEMP, deliberately NOT into the checkout.
      #
      # Go stamps the version by running `git status --porcelain` and treats
      # any output -- untracked files included -- as a modified tree, which
      # appends +dirty to the version. A dist/ directory inside the checkout
      # is clean for the first build and untracked for the other five, so five
      # of six binaries would stamp v1.2.3+dirty. Verified: they do.
      #
      # The assert below catches that, so nothing false would ship -- but the
      # release would arrive with no assets and a red job. Building outside
      # the tree removes the dependency rather than satisfying it with a
      # .gitignore entry that a later cleanup could reasonably delete.
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = windows ] && ext=".exe"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath \
                  -o "$RUNNER_TEMP/dist/ctchargen-$TAG-$os-$arch$ext" ./cmd/ctchargen
            done
          done
          git status --porcelain
          cd "$RUNNER_TEMP/dist" && sha256sum ctchargen-* > checksums.txt
          cat checksums.txt

      # The one thing here that can go wrong silently. A binary stamped
      # (devel) or with a pseudo-version looks fine, runs fine, and writes
      # that string into the build field of every record it generates -- so
      # the lie only surfaces when a user reports a record that cannot be
      # traced to a release.
      #
      # The comparison is exact. Both failure shapes CONTAIN the tag as a
      # substring -- a pseudo-version (v1.0.0-alpha.4.0.2026...-cb9d656) and a
      # dirty tree (v1.0.0-alpha.4+dirty) -- so a substring test would pass on
      # precisely what this exists to catch. Both were reproduced locally.
      #
      # Only the linux/amd64 binary is run, because that is the runner's own
      # architecture. The other five are built from the same checkout and are
      # witnessed by this one rather than tested themselves.
      - name: The binaries must know which release they are
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          printed=$("$RUNNER_TEMP/dist/ctchargen-$TAG-linux-amd64" version)
          echo "version says: $printed"
          stamped=$(echo "$printed" | awk '{print $2}')
          if [ "$stamped" != "$TAG" ]; then
            echo "::error::built at $stamped, but this release is $TAG"
            exit 1
          fi

      - name: Attach
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/dist/* \
            --clobber --repo "$GITHUB_REPOSITORY"
