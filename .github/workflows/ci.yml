# The gate, run on GitHub. This is deliberately `task` and not a
# reimplementation of it: a CI job that lists the checks itself can drift
# from the one a developer runs, and then green means two different
# things. Everything below exists to put the tools on the runner so that
# one command can be the whole job.
#
# Nothing here consults the rules PDFs: the Classic Traveller books are
# purchased artifacts this repository does not redistribute, so any
# future page-citation gate stays local-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run proves nothing; cancel it and keep the queue honest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: task (check + test)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by major, unlike the toolchain below: these are
      # the runner's own plumbing rather than part of what green means,
      # and a major is what GitHub deprecates against (the v4/v5 line was
      # still on Node 20 after the runners moved to 24).
      - uses: actions/checkout@v7

      # go-version-file reads go.mod, so the floor the module declares is
      # the version CI proves it against.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Unpinned deliberately: the gate is meant to fail when the tooling
      # moves, not to drift quietly behind it. golangci-lint runs
      # `default: all`, so a release that adds a linter should surface
      # here — .golangci.yml explains why that is wanted — and the same
      # goes for a gofumpt that reformats or a NilAway that learns a new
      # inference. The Brewfile has never pinned either, so this is also
      # what a developer's own `task` run uses.
      #
      # The cost is accepted: a run can go red for a reason unrelated to
      # the commit that triggered it. That is the signal, not a fault.
      # When it happens the tool moved — read the finding and answer it,
      # or adjust .golangci.yml, rather than reaching for a pin.
      - name: Install the toolchain
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install mvdan.cc/gofumpt@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install go.uber.org/nilaway/cmd/nilaway@latest
          npm install --global prettier

      - name: task
        run: task
