name: gate

# CI runs exactly `task` — the same gate a developer runs locally, with the
# same deliberately unpinned toolchain. When a tool moves and the gate goes
# red on untouched code, that is the signal working: answer the finding, do
# not pin the tool to silence it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install the gate's tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install go.uber.org/nilaway/cmd/nilaway@latest

      - run: task
